name: Build NVIDIA vGPU (Merged) driver for Unraid
run-name: NVIDIA ${{ inputs.driver_version }} / ${{ inputs.kernel_release }}

on:
  workflow_dispatch:
    inputs:
      driver_version:
        description: 'NVIDIA driver version (e.g. 535.309.01)'
        required: false
        default: '535.309.01'
        type: string
      vgpu_branch:
        description: 'alist vGPU branch directory (e.g. 16.14)'
        required: false
        default: '16.14'
        type: string
      windows_version:
        description: 'Windows driver version in the alist dir name (e.g. 539.72)'
        required: false
        default: '539.72'
        type: string
      alist_pkg_dir:
        description: 'Exact package dir for host-GRID-Windows layouts; must match the version inputs'
        required: false
        default: ''
        type: string
      kernel_release:
        description: 'Current stable/beta/RC kernel, or latest for the newest ich777 kernel'
        required: false
        default: 'latest'
        type: string
      package_build:
        description: 'auto increments; an explicit build number must exceed existing builds'
        required: false
        default: 'auto'
        type: string
      force_rebuild:
        description: 'Intentionally rebuild an already complete package under a new filename'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.plan.outputs.build }}
      kernel_release: ${{ steps.plan.outputs.kernel_release }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Test kernel targeting and build policy
        run: python3 -m unittest discover -s tests -v

      - name: Plan current-kernel build
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.driver_version }}
          ALIST_VGPU_BRANCH: ${{ inputs.vgpu_branch }}
          ALIST_WINVER: ${{ inputs.windows_version }}
          ALIST_PKG_DIR: ${{ inputs.alist_pkg_dir }}
          KERNEL_RELEASE: ${{ inputs.kernel_release }}
          PACKAGE_BUILD_INPUT: ${{ inputs.package_build }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: python3 scripts/nvidia-ci.py plan

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    # Resolve "latest" before locking, so manual and scheduled requests for
    # the same kernel/version serialize without displacing unrelated builds.
    concurrency:
      group: nvidia-vgpu-${{ needs.plan.outputs.kernel_release }}-${{ inputs.driver_version }}
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      # GCC 15 matches the official Unraid 6.18 kernel toolchain.
      image: gcc:15.3.0
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git jq kmod \
            libelf-dev make python3 tar xz-utils
          rm -rf /var/lib/apt/lists/*
          gcc --version | head -1
          nproc

      - name: Refresh build plan under the kernel and driver lock
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.driver_version }}
          ALIST_VGPU_BRANCH: ${{ inputs.vgpu_branch }}
          ALIST_WINVER: ${{ inputs.windows_version }}
          ALIST_PKG_DIR: ${{ inputs.alist_pkg_dir }}
          KERNEL_RELEASE: ${{ needs.plan.outputs.kernel_release }}
          PACKAGE_BUILD_INPUT: ${{ inputs.package_build }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: python3 scripts/nvidia-ci.py plan

      - name: Build NVIDIA merged driver package
        if: steps.plan.outputs.build == 'true'
        shell: bash
        env:
          VERSION: ${{ inputs.driver_version }}
          ALIST_VGPU_BRANCH: ${{ inputs.vgpu_branch }}
          ALIST_WINVER: ${{ inputs.windows_version }}
          ALIST_PKG_DIR: ${{ inputs.alist_pkg_dir }}
          KERNEL_RELEASE: ${{ steps.plan.outputs.kernel_release }}
          PACKAGE_BUILD: ${{ steps.plan.outputs.package_build }}
          # Preserve explicit sources and the fallback for blocked mirrors.
          GRID_RUN_URL: ${{ vars.GRID_RUN_URL }}
          VGPU_RUN_URL: ${{ vars.VGPU_RUN_URL }}
          RUN_MIRROR_REPO: ${{ vars.RUN_MIRROR_REPO }}
          RUN_MIRROR_TAG: ${{ vars.RUN_MIRROR_TAG }}
          RUN_MIRROR_BASE: ${{ vars.RUN_MIRROR_BASE }}
        run: |
          set -euo pipefail
          export TARGET_KERNEL_VERSION="${KERNEL_RELEASE%-Unraid}"
          ./scripts/build-nvidia-driver.sh

      - name: Publish complete immutable package
        if: steps.plan.outputs.build == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/nvidia-ci.py publish
