name: Build NVIDIA vGPU (Merged) driver for Unraid

on:
  workflow_dispatch:
    inputs:
      driver_version:
        description: 'NVIDIA driver version (e.g. 535.309.01)'
        required: false
        default: '535.309.01'
        type: string
      kernel_release:
        description: 'Unraid kernel release (e.g. 6.18.44-Unraid)'
        required: false
        default: '6.18.44-Unraid'
        type: string
      package_build:
        description: 'Package build number'
        required: false
        default: '1'
        type: string

permissions:
  contents: write

concurrency:
  group: nvidia-vgpu-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      # GCC 15 matches the official Unraid kernel toolchain; the 6.18 kernel
      # requires -fmin-function-alignment (gcc >= 14).
      image: gcc:15.3.0
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex git jq kmod \
            libelf-dev make tar xz-utils
          rm -rf /var/lib/apt/lists/*
          gcc --version | head -1
          nproc

      - name: Build NVIDIA merged driver package
        shell: bash
        env:
          VERSION: ${{ inputs.driver_version }}
          KERNEL_RELEASE: ${{ inputs.kernel_release }}
          TARGET_KERNEL_VERSION: ${{ inputs.kernel_release }}
          PACKAGE_BUILD: ${{ inputs.package_build }}
          # .run files are fetched from the alist mirror (see build script)
        run: |
          set -euo pipefail
          export TARGET_KERNEL_VERSION="${KERNEL_RELEASE%-Unraid}"
          ./scripts/build-nvidia-driver.sh

      - name: Publish Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KERNEL_RELEASE: ${{ inputs.kernel_release }}
        run: |
          set -euo pipefail
          pkg="$(ls out/nvidia-*.txz | head -1)"
          pkg_base="$(basename "$pkg")"
          release_tag="${KERNEL_RELEASE}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases"
          rid="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                  "${api}/tags/${release_tag}" | jq -r '.id // empty' 2>/dev/null || true)"
          if [ -z "$rid" ]; then
            rid="$(curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
                   -H "Accept: application/vnd.github+json" \
                   -d "{\"tag_name\":\"${release_tag}\",\"name\":\"NVIDIA vGPU (Merged) for ${release_tag}\",\"body\":\"MERGED driver (vGPU + GRID) ${{ inputs.driver_version }} for ${release_tag}\"}" \
                   "${api}" | jq -r '.id')"
          fi
          # upload (or replace) the package assets via uploads.github.com
          upload_api="https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${rid}/assets"
          for f in "$pkg" "$pkg.md5"; do
            base="$(basename "$f")"
            asset_id="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                        "${api}/${rid}/assets?per_page=100" | \
                        jq -r --arg n "$base" '.[] | select(.name == $n) | .id' | head -1)"
            if [ -n "$asset_id" ]; then
              curl -fsSL -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
                "${api}/assets/${asset_id}"
            fi
            curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "${upload_api}?name=${base}"
          done
          echo "Published ${pkg_base} to release ${release_tag}"
