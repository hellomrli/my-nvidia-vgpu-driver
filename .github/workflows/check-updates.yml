name: Check NVIDIA vGPU / Unraid kernel updates

on:
  schedule:
    # Daily 01:00 UTC (09:00 CST): both series for the current stable, public
    # beta/RC and latest ich777 preparation kernels. Shared kernels build once.
    - cron: '0 1 * * *'
  workflow_dispatch: {}   # allow a manual check

permissions:
  contents: read
  actions: write          # to dispatch the build workflow

concurrency:
  group: vgpu-update-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Test kernel targeting and build policy
        run: python3 -m unittest discover -s tests -v

      - name: Check for updates
        id: check
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          result="$(./scripts/check-updates.sh)"
          echo "$result" | tee /tmp/check-result.json

          echo "build_count=$(echo "$result" | jq -r '.builds | length')" >> "$GITHUB_OUTPUT"
          echo "kernel_releases=$(echo "$result" | jq -c '.kernel_releases')" >> "$GITHUB_OUTPUT"
          echo "$result" | jq -c '.builds' > /tmp/builds.json

      - name: Trigger driver builds
        if: steps.check.outputs.build_count != '0'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-nvidia.yml/dispatches"
          # Each kernel/driver pair has its own build lock; unrelated pending
          # builds must not replace one another in a global concurrency group.
          while IFS= read -r build; do
            label="$(jq -r '"\(.major)x driver \(.driver_version) for \(.kernel_release) (\(.reason))"' <<<"$build")"
            payload="$(jq -n --argjson b "$build" --arg ref "$GITHUB_REF_NAME" \
              '{ref:$ref, inputs:{
                 driver_version:$b.driver_version,
                 vgpu_branch:$b.vgpu_branch,
                 windows_version:$b.windows_version,
                 alist_pkg_dir:$b.alist_pkg_dir,
                 kernel_release:$b.kernel_release,
                 package_build:"auto"}}')"
            echo "Dispatching: $label"
            curl -fsS -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "$payload" "$api"
            echo "Dispatched: $label"
          done < <(jq -c '.[]' /tmp/builds.json)

      - name: Report (no build needed)
        if: steps.check.outputs.build_count == '0'
        shell: bash
        env:
          TARGET_KERNELS: ${{ steps.check.outputs.kernel_releases }}
        run: |
          echo "Both NVIDIA series already have complete matching packages."
          echo "Current kernels: $TARGET_KERNELS"
