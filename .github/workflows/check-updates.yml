name: Check NVIDIA vGPU / Unraid kernel updates

on:
  schedule:
    # Wednesdays 01:17 UTC (09:17 Asia/Shanghai), once a week to reduce
    # mirror requests. Check both series for the current stable, public beta/RC
    # and latest ich777 preparation kernels. Shared kernels build once.
    - cron: '17 1 * * 3'
  workflow_dispatch: {}   # allow a manual check

permissions:
  contents: read
  actions: write          # to dispatch the build workflow

concurrency:
  group: vgpu-update-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Test kernel targeting and build policy
        run: python3 -m unittest discover -s tests -v

      - name: Locate last verified NVIDIA driver catalog
        id: catalog
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100")"
          artifact="$(jq -c --arg ref "$GITHUB_REF_NAME" \
            '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == $ref
              and (.name | test("^nvidia-driver-catalog-[1-9][0-9]*$")))]
              | max_by(.created_at) // empty' <<<"$metadata")"
          if [ -n "$artifact" ]; then
            echo "run_id=$(jq -r '.workflow_run.id' <<<"$artifact")" >> "$GITHUB_OUTPUT"
            echo "artifact_name=$(jq -r '.name' <<<"$artifact")" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore last verified NVIDIA driver catalog
        if: steps.catalog.outputs.run_id != ''
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ steps.catalog.outputs.artifact_name }}
          path: out
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.catalog.outputs.run_id }}

      - name: Initialize driver catalog when no cache is available
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [ ! -f out/driver-catalog.json ]; then
            cp config/vgpu-driver-catalog.json out/driver-catalog.json
          fi

      - name: Check for updates
        id: check
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VGPU_CATALOG_CACHE: out/driver-catalog.json
        run: |
          set -euo pipefail
          result="$(./scripts/check-updates.sh)"
          echo "$result" | tee /tmp/check-result.json

          echo "build_count=$(echo "$result" | jq -r '.builds | length')" >> "$GITHUB_OUTPUT"
          echo "kernel_releases=$(echo "$result" | jq -c '.kernel_releases')" >> "$GITHUB_OUTPUT"
          echo "catalog_latest_confirmed=$(echo "$result" | jq -r '.driver_catalog.latest_confirmed')" >> "$GITHUB_OUTPUT"
          echo "$result" | jq -c '.builds' > /tmp/builds.json

      - name: Save successfully verified NVIDIA driver catalog
        if: always() && steps.check.outputs.catalog_latest_confirmed == 'true'
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: nvidia-driver-catalog-${{ github.run_attempt }}
          path: out/driver-catalog.json
          retention-days: 35
          if-no-files-found: error

      - name: Trigger driver builds
        if: steps.check.outputs.build_count != '0'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-nvidia.yml/dispatches"
          # Each kernel/driver pair has its own build lock; unrelated pending
          # builds must not replace one another in a global concurrency group.
          while IFS= read -r build; do
            label="$(jq -r '"\(.major)x driver \(.driver_version) for \(.kernel_release) (\(.reason))"' <<<"$build")"
            payload="$(jq -n --argjson b "$build" --arg ref "$GITHUB_REF_NAME" \
              '{ref:$ref, inputs:{
                 driver_version:$b.driver_version,
                 vgpu_branch:$b.vgpu_branch,
                 windows_version:$b.windows_version,
                 alist_pkg_dir:$b.alist_pkg_dir,
                 kernel_release:$b.kernel_release,
                 package_build:"auto"}}')"
            echo "Dispatching: $label"
            curl -fsS -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "$payload" "$api"
            echo "Dispatched: $label"
          done < <(jq -c '.[]' /tmp/builds.json)

      - name: Report (no build needed)
        if: steps.check.outputs.build_count == '0'
        shell: bash
        env:
          TARGET_KERNELS: ${{ steps.check.outputs.kernel_releases }}
          CATALOG_LATEST_CONFIRMED: ${{ steps.check.outputs.catalog_latest_confirmed }}
        run: |
          if [ "$CATALOG_LATEST_CONFIRMED" = 'true' ]; then
            echo "Both NVIDIA series already have complete matching packages."
          else
            echo "Cached NVIDIA versions have complete matching kernel packages."
            echo "The NVIDIA mirror returned HTTP 403; newer driver versions could not be checked."
          fi
          echo "Current kernels: $TARGET_KERNELS"
