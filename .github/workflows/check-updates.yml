name: Check NVIDIA vGPU / Unraid kernel updates

on:
  schedule:
    # daily 01:00 UTC (09:00 CST) - checks every tracked vGPU line (16.x + 19.x)
    # and ich777/unraid_kernel for new releases
    - cron: '0 1 * * *'
  workflow_dispatch: {}   # allow a manual check

permissions:
  contents: read
  actions: write          # to dispatch the build workflow

concurrency:
  group: vgpu-update-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check for updates
        id: check
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          result="$(./scripts/check-updates.sh)"
          echo "$result" | tee /tmp/check-result.json

          echo "build_count=$(echo "$result" | jq -r '.builds | length')" >> "$GITHUB_OUTPUT"
          echo "kernel_release=$(echo "$result" | jq -r '.kernel_release')" >> "$GITHUB_OUTPUT"
          echo "reason=$(echo "$result" | jq -r '.reason')" >> "$GITHUB_OUTPUT"
          echo "$result" | jq -c '.builds' > /tmp/builds.json

      - name: Trigger driver builds
        if: steps.check.outputs.build_count != '0'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-nvidia.yml/dispatches"
          # one dispatch per tracked vGPU line that is missing a package for the
          # new kernel (16.x and 19.x are built independently; the build
          # workflow serialises them through its concurrency group)
          while IFS= read -r build; do
            label="$(jq -r '"\(.major)x driver \(.driver_version) for \(.kernel_release) (\(.reason))"' <<<"$build")"
            payload="$(jq -n --argjson b "$build" \
              '{ref:"master", inputs:{
                 driver_version:$b.driver_version,
                 vgpu_branch:$b.vgpu_branch,
                 windows_version:$b.windows_version,
                 alist_pkg_dir:$b.alist_pkg_dir,
                 kernel_release:$b.kernel_release,
                 package_build:"1"}}')"
            echo "Dispatching: $label"
            curl -fsS -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "$payload" "$api"
            echo "Dispatched: $label"
          done < <(jq -c '.[]' /tmp/builds.json)

      - name: Report (no build needed)
        if: steps.check.outputs.build_count == '0'
        shell: bash
        run: |
          echo "Up to date. ${{ steps.check.outputs.reason }}"
          echo "kernel=${{ steps.check.outputs.kernel_release }}"
